[package]
name = "wrklog"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dotenvy = "0.15.7"
rusqlite = { version = "0.40.2", features = ["bundled"] }
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
